<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>こんだて帳</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif;background:#FFF0F3;color:#3D2C2C;min-height:100vh}
.app{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:#FFF0F3}

/* ── ヘッダー ── */
.header{background:linear-gradient(160deg,#FFD6E0 0%,#FFE8EE 60%,#FFF0F3 100%);padding:18px 16px 14px;position:sticky;top:0;z-index:20;overflow:visible}
.header-deco{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;overflow:hidden}
.header-deco span{position:absolute;font-size:10px;opacity:0.5}
.header-row{display:flex;align-items:flex-start;justify-content:space-between;position:relative}
.header-left{flex:1}
.app-title{font-size:26px;font-weight:900;color:#D4607A;letter-spacing:0.5px}
.header-date{font-size:12px;color:#C08090;margin-top:4px;font-weight:600;display:flex;align-items:center;gap:4px}
.settings-btn{background:#fff;border:2px solid #F5C0C8;border-radius:14px;padding:9px 14px;font-size:12px;font-weight:800;color:#D4607A;cursor:pointer;display:flex;align-items:center;gap:5px;box-shadow:0 3px 10px rgba(212,96,122,0.15);white-space:nowrap;font-family:inherit}

/* ── ふぅちゃんキャラ ── */
.fuu-wrap{position:relative;height:60px;margin:0 14px;z-index:5}
.fuu-card{background:linear-gradient(135deg,#FFE8EE,#FFF0F3);border:2px solid #FFD0DA;border-radius:20px;padding:8px 14px;display:flex;align-items:center;gap:10px;position:relative;overflow:visible;box-shadow:0 4px 16px rgba(212,96,122,0.12)}
.fuu-img{width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 4px 12px rgba(212,96,122,0.25);position:absolute;top:-28px;right:14px;z-index:10;background:#FFE4EA}
.fuu-text{font-size:13px;font-weight:700;color:#D4607A;padding-right:86px;line-height:1.5}

/* ── ナビ ── */
.nav{display:flex;background:#fff;border-top:2px solid #FFE0E6;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;padding:10px 4px 10px;border:none;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:#CBA0A8;font-size:10px;font-weight:700;transition:color 0.15s;font-family:inherit}
.nav-btn.active{color:#D4607A}
.nav-icon{font-size:22px;line-height:1}

/* ── コンテンツ ── */
.content{flex:1;padding:10px 14px 90px;overflow-y:auto}

/* ── カード ── */
.card{background:#fff;border-radius:20px;padding:16px;margin-bottom:12px;border:2px solid #FFE0E6;box-shadow:0 4px 16px rgba(212,96,122,0.08)}
.card-sm{background:#fff;border-radius:16px;padding:13px 15px;margin-bottom:10px;border:2px solid #FFE0E6;box-shadow:0 2px 10px rgba(212,96,122,0.06)}

/* ── セクションラベル ── */
.sec-label{font-size:13px;font-weight:800;color:#C08090;margin:16px 0 8px;display:flex;align-items:center;gap:6px}
.sec-label:first-child{margin-top:0}

/* ── バッジ ── */
.badge-pink{display:inline-flex;align-items:center;font-size:11px;font-weight:800;padding:5px 12px;border-radius:99px;background:#FFE4EC;color:#D4607A;border:1.5px solid #F5C0C8}

/* ── ボタン ── */
.btn{display:inline-flex;align-items:center;gap:5px;padding:10px 16px;border-radius:14px;border:2px solid #FFD0DA;background:#fff;cursor:pointer;font-size:13px;font-weight:800;color:#D4607A;transition:all 0.15s;font-family:inherit}
.btn:active{transform:scale(0.96)}
.btn-primary{background:linear-gradient(135deg,#FF8FAB,#D4607A);color:#fff;border:none;box-shadow:0 6px 18px rgba(212,96,122,0.35)}
.btn-primary:active{transform:scale(0.97)}
.btn-mint{background:linear-gradient(135deg,#A8E6CF,#5CC8A0);color:#fff;border:none;box-shadow:0 4px 12px rgba(92,200,160,0.3)}
.btn-lavender{background:linear-gradient(135deg,#C8B4E8,#9B7FCC);color:#fff;border:none;box-shadow:0 4px 12px rgba(155,127,204,0.3)}
.btn-sm{padding:7px 13px;font-size:12px;border-radius:12px}
.btn-full{width:100%;justify-content:center;padding:16px}
.btn-ghost{border-color:transparent;background:transparent;color:#C08090}

/* ── 予算バー ── */
.budget-track{background:#FFE8EC;border-radius:99px;height:10px;overflow:hidden;margin:12px 0 6px}
.budget-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#FFB3C6,#D4607A);transition:width 0.5s}
.budget-fill.warn{background:linear-gradient(90deg,#F5C842,#E8A020)}
.budget-fill.over{background:linear-gradient(90deg,#F08080,#C0392B)}
.budget-nums{display:flex;justify-content:space-between;font-size:12px;color:#C08090;font-weight:700}

/* ── アップロード ── */
.upload-area{border:2.5px dashed #F5C0C8;border-radius:18px;padding:26px;text-align:center;color:#E8A0B0;cursor:pointer;background:linear-gradient(135deg,#FFF8FA,#FFF0F3);transition:all 0.15s;margin-bottom:12px}
.upload-area:active{border-color:#D4607A;background:#FFE8EE}
.upload-icon{font-size:36px;margin-bottom:8px;display:block}
.upload-text{font-size:13px;line-height:1.7;font-weight:600}

/* ── AIバナー ── */
.ai-banner{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#FFF0F5,#FFE4EA);border:1.5px solid #F5C8D0;border-radius:14px;padding:11px 15px;margin-bottom:12px;font-size:12px;color:#D4607A;font-weight:700}

/* ── 食事スロット ── */
.meal-row{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1.5px dashed #FFE0E6}
.meal-row:last-child{border-bottom:none;padding-bottom:0}
.meal-row:first-child{padding-top:0}
.meal-icon{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.meal-icon-asa{background:linear-gradient(135deg,#FFF5CC,#FFE566)}
.meal-icon-hiru{background:linear-gradient(135deg,#CCFFE8,#66DDA0)}
.meal-icon-yoru{background:linear-gradient(135deg,#E0CCFF,#A080E8)}
.meal-label{font-size:12px;font-weight:800;color:#C08090;min-width:20px}
.meal-name{flex:1;font-size:13px;color:#3D2C2C;line-height:1.4;font-weight:600}
.meal-empty{flex:1;font-size:13px;color:#DDB8C0;font-weight:500}
.heart-btn{background:none;border:none;cursor:pointer;font-size:24px;line-height:1;padding:2px;transition:transform 0.15s}
.heart-btn:active{transform:scale(1.4)}

/* ── 在庫行 ── */
.stock-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1.5px dashed #FFE8EC}
.stock-row:last-child{border-bottom:none;padding-bottom:0}
.stock-row:first-child{padding-top:0}
.stock-name{flex:1;font-size:14px;font-weight:600}
.stock-amount{font-size:12px;color:#C08090;text-align:right;min-width:54px;font-weight:700}
.expiry-tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;margin-left:5px}
.expiry-warn{background:#FFE4EC;color:#D4607A}
.expiry-ok{background:#F2F0EB;color:#999}

/* ── 買い物 ── */
.check-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1.5px dashed #FFE8EC}
.check-row:last-child{border-bottom:none;padding-bottom:0}
.check-row:first-child{padding-top:0}
.check-box{width:26px;height:26px;border:2.5px solid #F5C0C8;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.15s;background:#fff}
.check-box.checked{background:linear-gradient(135deg,#FF8FAB,#D4607A);border-color:transparent}
.check-text{flex:1;font-size:14px;font-weight:600}
.check-text.done{color:#CCC;text-decoration:line-through}

/* ── お気に入り ── */
.fav-card{background:#fff;border-radius:18px;padding:14px 16px;margin-bottom:10px;border:2px solid #FFE0E6;display:flex;align-items:center;gap:12px;box-shadow:0 3px 12px rgba(212,96,122,0.08)}
.fav-rank{font-size:24px;min-width:30px;text-align:center}
.fav-info{flex:1}
.fav-name{font-size:15px;font-weight:800;color:#3D2C2C}
.fav-count{font-size:12px;color:#CBA0A8;margin-top:2px;font-weight:700}

/* ── 週カレンダー ── */
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:14px}
.wk-day{text-align:center;font-size:11px;color:#CBA0A8;padding:4px 2px;font-weight:800}
.wk-date{text-align:center;font-size:14px;padding:8px 2px;border-radius:10px;cursor:pointer;position:relative;color:#3D2C2C;font-weight:600}
.wk-date.today{background:linear-gradient(135deg,#FF8FAB,#D4607A);color:#fff;font-weight:900}
.wk-date.has-dot::after{content:'';display:block;width:5px;height:5px;border-radius:50%;background:#F09090;margin:2px auto 0}
.wk-date.today.has-dot::after{background:rgba(255,255,255,0.8)}

/* ── タブ ── */
.tabs{display:flex;gap:7px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 18px;border-radius:99px;font-size:13px;font-weight:800;cursor:pointer;border:2px solid #FFD0DA;background:#fff;color:#CBA0A8;white-space:nowrap;transition:all 0.15s;font-family:inherit}
.tab.active{background:linear-gradient(135deg,#FF8FAB,#D4607A);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(212,96,122,0.3)}

/* ── 入力 ── */
.input-label{font-size:13px;color:#C08090;margin-bottom:6px;display:block;font-weight:700}
.input-field{width:100%;padding:12px 15px;border:2px solid #FFD0DA;border-radius:14px;font-size:14px;background:#fff;color:#3D2C2C;font-family:inherit;outline:none}
.input-field:focus{border-color:#F07090;box-shadow:0 0 0 3px rgba(240,112,144,0.12)}
.input-group{margin-bottom:14px}

/* ── モーダル ── */
.modal-backdrop{position:fixed;inset:0;background:rgba(61,44,44,0.4);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.2s}
.modal-backdrop.open{opacity:1;pointer-events:all}
.modal-sheet{background:#FFF0F3;border-radius:28px 28px 0 0;padding:0 0 48px;width:100%;max-width:430px;max-height:88vh;overflow-y:auto;transform:translateY(30px);transition:transform 0.25s}
.modal-backdrop.open .modal-sheet{transform:translateY(0)}
.modal-handle{width:44px;height:5px;border-radius:99px;background:#F5C0C8;margin:16px auto 18px}
.modal-inner{padding:0 18px}
.modal-title{font-size:18px;font-weight:900;margin-bottom:18px;color:#D4607A}

/* ── セレクト ── */
.select-field{padding:9px 13px;border:2px solid #FFD0DA;border-radius:12px;font-size:13px;background:#fff;color:#3D2C2C;font-family:inherit;font-weight:700}

/* ── チップ ── */
.ng-list{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.ng-chip{font-size:11px;padding:4px 10px;border-radius:99px;background:#FFE8EC;color:#D4607A;font-weight:700}

/* ── ストアボタン ── */
.store-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.store-btn{padding:8px 16px;border-radius:12px;font-size:12px;font-weight:800;border:2px solid #FFD0DA;background:#fff;color:#CBA0A8;cursor:pointer;font-family:inherit;transition:all 0.15s}
.store-btn.active{background:linear-gradient(135deg,#FF8FAB,#D4607A);color:#fff;border-color:transparent}

/* ── トースト ── */
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#FF8FAB,#D4607A);color:#fff;font-size:13px;font-weight:800;padding:12px 22px;border-radius:99px;z-index:200;opacity:0;pointer-events:none;transition:opacity 0.2s;white-space:nowrap;box-shadow:0 6px 20px rgba(212,96,122,0.4)}
.toast.show{opacity:1}

/* ── 警告バナー ── */
.warn-banner{background:#FFF8E8;border-radius:16px;padding:13px 15px;margin-bottom:12px;border:2px solid #F5DFA0}
.warn-banner-title{font-size:13px;font-weight:800;color:#B5740A;margin-bottom:5px}
.warn-item{font-size:13px;color:#B5740A;font-weight:600}
</style>
</head>
<body>
<div class="app">

  <!-- ヘッダー -->
  <div class="header">
    <div class="header-deco">
      <span style="top:8px;left:20px">🩷</span>
      <span style="top:14px;left:80px;font-size:7px">✦</span>
      <span style="top:6px;left:140px;font-size:8px">🌸</span>
      <span style="top:16px;left:200px;font-size:7px">⭐</span>
      <span style="top:8px;left:260px;font-size:8px">🩷</span>
      <span style="top:4px;right:80px;font-size:7px">✦</span>
    </div>
    <div class="header-row">
      <div class="header-left">
        <div class="app-title">🍴🥄 こんだて帳 🩷</div>
        <div class="header-date" id="header-date">📅 </div>
      </div>
      <button class="settings-btn" onclick="openModal('settings')">⚙️ 設定</button>
    </div>
  </div>

  <!-- ふぅちゃん -->
  <div style="position:relative;margin:10px 14px 0;z-index:5">
    <div class="card" style="padding:12px 14px;padding-right:90px;min-height:54px;display:flex;align-items:center;background:linear-gradient(135deg,#FFF5F8,#FFE8EE)">
      <div style="font-size:13px;font-weight:700;color:#D4607A;line-height:1.6">ふぅちゃんと一緒に<br>今日のごはん考えよ🌸</div>
    </div>
    <img src="https://raw.githubusercontent.com/SakiKihara/kondate/main/%E3%81%B5%E3%81%85%E3%81%A1%E3%82%83%E3%82%93.jpg"
      alt="ふぅちゃん"
      style="width:74px;height:74px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 4px 14px rgba(212,96,122,0.3);position:absolute;top:-10px;right:14px;z-index:10;background:#FFE4EA">
  </div>

  <div class="content" id="content" style="margin-top:12px"></div>

  <nav class="nav">
    <button class="nav-btn active" id="nav-today" onclick="switchPage('today')">
      <div class="nav-icon">🍳</div>今日
    </button>
    <button class="nav-btn" id="nav-week" onclick="switchPage('week')">
      <div class="nav-icon">📅</div>週間
    </button>
    <button class="nav-btn" id="nav-stock" onclick="switchPage('stock')">
      <div class="nav-icon">🥦</div>在庫
    </button>
    <button class="nav-btn" id="nav-shopping" onclick="switchPage('shopping')">
      <div class="nav-icon">🛒</div>買い物
    </button>
    <button class="nav-btn" id="nav-fav" onclick="switchPage('fav')">
      <div class="nav-icon">🩷</div>お気に入り
    </button>
  </nav>
</div>

<div class="modal-backdrop" id="modal-backdrop" onclick="closeModal()">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-inner" id="modal-inner"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const DAYS = ['日','月','火','水','木','金','土'];
const today = new Date();
const todayDow = today.getDay();

const S = {
  page: 'today',
  budget: { goal: 10000, spent: 0 },
  meals: {
    朝: { name: null, liked: false, persons: 4, recipe: null },
    昼: { name: null, liked: false, persons: 4, recipe: null },
    夜: { name: null, liked: false, persons: 4, recipe: null },
  },
  week: { 0:{}, 1:{}, 2:{}, 3:{}, 4:{}, 5:{}, 6:{} },
  stock: { 食材:[], 調味料:[], 日用品:[] },
  shopping: {},
  fav:[],
  family:[
    {name:'お父さん', avatar:'父', ng:['パクチー']},
    {name:'お母さん', avatar:'母', ng:['納豆']},
    {name:'小6（長男）', avatar:'6', ng:['ピーマン']},
    {name:'小2（次男）', avatar:'2', ng:['しいたけ','にんじん']},
  ],
  stockTab: '食材',
  chirashiLoaded: false,
};

(function(){
  const d = today;
  document.getElementById('header-date').textContent =
    `📅 ${d.getMonth()+1}月${d.getDate()}日（${DAYS[d.getDay()]}）`;
})();

function switchPage(p) {
  S.page = p;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-' + p).classList.add('active');
  render();
}

function render() {
  const c = document.getElementById('content');
  const fns = {today:rToday, week:rWeek, stock:rStock, shopping:rShopping, fav:rFav};
  c.innerHTML = fns[S.page]();
}

function syncTodayFromWeek() {
  // 週間→今日に反映（今日が空の場合のみ）
  const todayWeek = S.week[todayDow] || {};
  ['朝','昼','夜'].forEach(t => {
    if (todayWeek[t] && !S.meals[t].name) {
      S.meals[t].name = todayWeek[t];
      S.meals[t].recipe = RECIPES[todayWeek[t]] || null;
    }
  });
}

function syncWeekFromToday() {
  // 今日→週間に反映
  if (!S.week[todayDow]) S.week[todayDow] = {};
  ['朝','昼','夜'].forEach(t => {
    if (S.meals[t].name) {
      S.week[todayDow][t] = S.meals[t].name;
    } else {
      delete S.week[todayDow][t];
    }
  });
}

function rToday() {
  syncTodayFromWeek();
  const pct = Math.min(100, Math.round(S.budget.spent / S.budget.goal * 100));
  const barCls = pct >= 100 ? 'over' : pct >= 80 ? 'warn' : '';
  const expiring = S.stock.食材.filter(i => i.warn);

  let h = `<div class="card">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">
      <span style="font-size:24px">🐷</span>
      <span style="font-size:14px;font-weight:800;color:#C08090">今週の予算</span>
      <span class="badge-pink" style="margin-left:auto">週¥${S.budget.goal.toLocaleString()}目標</span>
    </div>
    <div class="budget-track"><div class="budget-fill ${barCls}" style="width:${Math.max(pct,2)}%"></div></div>
    <div class="budget-nums"><span>使用 ¥${S.budget.spent.toLocaleString()}</span><span>残り ¥${(S.budget.goal-S.budget.spent).toLocaleString()}</span></div>
  </div>`;

  if (expiring.length) {
    h += `<div class="warn-banner"><div class="warn-banner-title">⚠️ 期限が近い食材を使ったメニューを提案</div>`;
    expiring.forEach(i => { h += `<div class="warn-item">・${i.name}（${i.expiry || '残り少'}）</div>`; });
    h += `</div>`;
  }

  h += `<div class="sec-label">🌸 チラシを読み込む</div>`;
  if (S.chirashiLoaded) {
    h += '<div class="card" style="display:flex;align-items:center;gap:10px"><span style="font-size:24px">🗞️</span><div style="flex:1"><div style="font-size:14px;font-weight:800">チラシ読み込み済み</div><div style="font-size:12px;color:#C08090;margin-top:2px">特売品を考慮して献立を提案します</div></div><button class="btn btn-ghost btn-sm" onclick="S.chirashiLoaded=false;render()">✕</button></div>';
  } else {
    h += '<label for="chirashi-input" class="upload-area" style="cursor:pointer;display:block"><span class="upload-icon">📷</span><div class="upload-text">スーパーのチラシスクショを<br>タップして追加（最大2店舗）</div></label><input id="chirashi-input" type="file" accept="image/*" multiple style="display:none" onchange="loadChirashi()">';
  }

  h += `<div class="sec-label">🌸 今日のメニュー</div>
  ${!S.chirashiLoaded ? `<div style="background:linear-gradient(135deg,#FFF8E8,#FFF3D6);border:2px solid #F5DFA0;border-radius:14px;padding:11px 14px;margin-bottom:10px;display:flex;align-items:center;gap:8px">
    <span style="font-size:18px">🗞️</span>
    <div style="flex:1;font-size:12px;font-weight:700;color:#B5740A">チラシを読み込むと予算内で特売品を活かした献立を提案できるよ！</div>
  </div>` : ''}
  <div class="ai-banner">💡 AI提案：在庫・チラシ・栄養バランスを考慮してご提案♪</div>
  <div class="card">`;

  const mealCfg = {
    朝:{icon:'☀️',cls:'meal-icon-asa',btnCls:'btn-primary'},
    昼:{icon:'🌤️',cls:'meal-icon-hiru',btnCls:'btn-mint'},
    夜:{icon:'🌙',cls:'meal-icon-yoru',btnCls:'btn-lavender'},
  };

function rWeek() {

  } else {
    chirashiAlert = '<div style="background:#EAF5EE;border:2px solid #A8DDB8;border-radius:16px;padding:11px 16px;margin-bottom:10px;display:flex;align-items:center;gap:8px"><span style="font-size:20px">✅</span><div style="font-size:13px;font-weight:700;color:#2D8A4E">チラシ読み込み済み！特売品を考慮して提案します</div></div>';
  }

  let h = chirashiAlert +

  </button>
  ${hasWeekMeals ? `<button class="btn btn-full" style="margin-bottom:12px;border-color:#F5C0C8;color:#D4607A;border-radius:18px;padding:14px;font-size:14px" onclick="openModal('weekShoppingConfirm')">🛒 今週の買い物リストを作る</button>` : ''}
  <div class="card"><div class="week-grid">`;
  DAYS.forEach(d => { h += `<div class="wk-day">${d}</div>`; });
  for (let i = 0; i < 7; i++) {
    const d = new Date(startOfWeek);
    d.setDate(startOfWeek.getDate() + i);
    const isToday = i === todayDow;
    const hasDot = Object.keys(S.week[i]||{}).length > 0;
    h += `<div class="wk-date ${isToday?'today':''} ${hasDot?'has-dot':''}" onclick="openModal('dayedit',${i})">${d.getDate()}</div>`;
  }
  h += `</div></div>`;
  for (let i = 0; i < 7; i++) {
    const meals = S.week[i] || {};
    const d = new Date(startOfWeek);
    d.setDate(startOfWeek.getDate() + i);
    const isToday = i === todayDow;
    if (!isToday && Object.keys(meals).length === 0) continue;
    h += `<div class="sec-label">🌸 ${d.getMonth()+1}/${d.getDate()}（${DAYS[i]}）${isToday?' 今日':''}</div><div class="card">`;
    let hasAny = false;
    ['朝','昼','夜'].forEach(s => {
      if (meals[s]) { hasAny = true; h += `<div class="meal-row"><span class="meal-label">${s}</span><span class="meal-name">${meals[s]}</span><button class="heart-btn">🤍</button></div>`; }
    });
    if (!hasAny) h += `<div style="font-size:14px;color:#DDB8C0;padding:4px 0;font-weight:600">まだ決まっていません</div>`;
    h += `<div style="padding-top:10px"><button class="btn btn-sm" onclick="openModal('dayedit',${i})">✏️ 編集する</button></div></div>`;
  }
  return h;
}

function toggleLike(time) {
  const m = S.meals[time];
  m.liked = !m.liked;
  if (m.liked && m.name) {
    const ex = S.fav.find(f => f.name === m.name);
    if (ex) ex.count++; else S.fav.unshift({name: m.name, count: 1});
    S.fav.sort((a,b) => b.count - a.count);
    showToast('❤️ お気に入りに追加しました');
  }
  saveData(); render();
}

function toggleCheck(store, idx) {
  S.shopping[store][idx].done = !S.shopping[store][idx].done;
  saveData(); render();
}

function deleteFav(idx) {
  S.fav.splice(idx, 1);
  showToast('🗑️ 削除しました');
  saveData(); render();
}

function loadChirashi(e) {
  const files = e ? e.target.files : null;
  if (files && files.length > 0) {
    S.chirashiLoaded = true;
    const names = Array.from(files).map(f => f.name.replace(/\.[^.]+$/, '')).join('・');
    showToast('📷 チラシを読み込みました');
    saveData();
    render();
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function buildMenuWithFav(defaultMenu) {
  // お気に入りのメインを週間提案に組み込む
  const favMains = S.fav.filter(f => f.category === 'main' && f.count >= 1);
  const favSides = S.fav.filter(f => f.category === 'side');
  const favSoups = S.fav.filter(f => f.category === 'soup');
  const favComplete = S.fav.filter(f => f.category === 'complete');

  if (favMains.length === 0 && favComplete.length === 0) return defaultMenu;

  // お気に入りを最大3日分使う
  const result = [...defaultMenu];
  const usedDays = [];
  const maxFavDays = Math.min(3, favMains.length + favComplete.length);

  // ランダムに何日かお気に入りで置き換え
  for (let i = 0; i < maxFavDays; i++) {
    let day;
    do { day = Math.floor(Math.random() * 7); } while (usedDays.includes(day));
    usedDays.push(day);

    if (favComplete.length > 0 && Math.random() > 0.6) {
      // 完結系（カレーなど）
      const fav = favComplete[Math.floor(Math.random() * favComplete.length)];
      result[day] = { ...result[day], 夜: fav.name };
    } else if (favMains.length > 0) {
      // メイン＋副菜＋汁物を組み合わせ
      const main = favMains[Math.floor(Math.random() * favMains.length)];
      const side1 = favSides.length > 0 ? favSides[Math.floor(Math.random() * favSides.length)].name : 'きゅうりの酢の物';
      const side2 = favSides.length > 1 ? favSides.filter(s => s.name !== side1)[Math.floor(Math.random() * (favSides.length-1))].name : 'ほうれん草のお浸し';
      const soup = favSoups.length > 0 ? favSoups[Math.floor(Math.random() * favSoups.length)].name : '味噌汁';
      result[day] = { ...result[day], 夜: `${main.name}・${side1}・${side2}・${soup}・ご飯` };
    }
  }
  return result;
}

function addWeekShoppingList() {
  const weekItems = {
    '万代': ['豚バラ 400g', '鶏もも肉 600g', '卵 10個', 'キャベツ 1玉', 'ほうれん草 1束', '玉ねぎ 3個', '豆腐 2丁', '納豆 3パック'],
    '業務スーパー': ['冷凍うどん 5食', '冷凍えだまめ', 'ちくわ 1袋'],
  };
  Object.entries(weekItems).forEach(([store, items]) => {
    if (!S.shopping[store]) S.shopping[store] = [];
    items.forEach(name => {
      if (!S.shopping[store].find(i => i.name === name)) {
        S.shopping[store].push({ name, done: false });
      }
    });
  });
  saveData();
  showToast('🛒 買い物リストに追加しました！');
  closeModal();
  switchPage('shopping');
}

function updateTodayMeal(time) {
  const input = document.getElementById('today-meal-input');
  if (!input || !input.value.trim()) { showToast('メニュー名を入力してね'); return; }
  S.meals[time].name = input.value.trim();
  S.meals[time].recipe = RECIPES[input.value.trim()] || null;
  syncWeekFromToday();
  saveData();
  showToast('✅ 更新しました');
  closeModal();
  render();
}

function addFavManual() {
  const val = document.getElementById('fav-input').value.trim();
  const catBtn = document.querySelector('#fav-cat-row .store-btn.active');
  if (!val) { showToast('メニュー名を入力してね'); return; }
  const catLabel = catBtn ? catBtn.textContent : '🍖 メイン';
  const cat = catLabel.includes('メイン') ? 'main' : catLabel.includes('副菜') ? 'side' : catLabel.includes('汁物') ? 'soup' : 'complete';
  const ex = S.fav.find(f => f.name === val);
  if (ex) { ex.count++; ex.category = cat; }
  else { S.fav.push({name: val, count: 1, category: cat}); }
  S.fav.sort((a,b) => b.count - a.count);
  showToast('❤️ お気に入りに追加しました');
  saveData(); closeModal(); render();
}

function addStockAndClose() {
  const nameEl = document.getElementById('stock-name-input');
  const amtEl = document.getElementById('stock-amt-input');
  const dateEl = document.getElementById('stock-date-input');
  const catBtn = document.querySelector('#cat-row .store-btn.active');
  if (!nameEl || !nameEl.value.trim()) { showToast('品名を入力してね'); return; }
  const cat = catBtn ? catBtn.textContent : '食材';
  let expiry = null;
  if (dateEl && dateEl.value) {
    const parts = dateEl.value.split('-');
    expiry = parseInt(parts[1]) + '/' + parseInt(parts[2]);
  }
  S.stock[cat].push({ name: nameEl.value.trim(), amount: amtEl.value.trim() || 'あり', expiry, warn: false });
  saveData(); showToast('✅ 在庫を追加しました'); closeModal(); render();
}

function addShopAndClose() {
  const nameEl = document.getElementById('shop-name-input');
  const storeBtn = document.querySelector('#shop-row .store-btn.active');
  if (!nameEl || !nameEl.value.trim()) { showToast('品名を入力してね'); return; }
  const store = storeBtn ? storeBtn.textContent : '万代';
  if (!S.shopping[store]) S.shopping[store] = [];
  S.shopping[store].push({ name: nameEl.value.trim(), done: false });
  saveData(); showToast('✅ 追加しました'); closeModal(); render();
}

function selectBtn(rowId, el) {
  document.querySelectorAll('#'+rowId+' .store-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
}

function closeModal() {
  document.getElementById('modal-backdrop').classList.remove('open');
}

const STORAGE_KEY = 'kondate_v1';
function saveData() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({budget:S.budget,meals:S.meals,week:S.week,stock:S.stock,shopping:S.shopping,fav:S.fav,family:S.family})); } catch(e) {}
}
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d.budget) S.budget = d.budget;
    if (d.meals) S.meals = d.meals;
    if (d.week) S.week = d.week;
    if (d.stock) S.stock = d.stock;
    if (d.shopping) S.shopping = d.shopping;
    if (d.fav) S.fav = d.fav;
    if (d.family) S.family = d.family;
  } catch(e) {}
}

loadData();
render();
