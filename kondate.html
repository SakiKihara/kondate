<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>こんだて帳</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif;background:#FFF0F3;color:#3D2C2C;min-height:100vh}
.app{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:#FFF0F3}

/* ── ヘッダー ── */
.header{background:linear-gradient(160deg,#FFD6E0 0%,#FFE8EE 60%,#FFF0F3 100%);padding:16px 16px 12px;position:sticky;top:0;z-index:20}
.header-deco{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;overflow:hidden}
.header-deco span{position:absolute;font-size:10px;opacity:0.5}
.header-row{display:flex;align-items:flex-start;justify-content:space-between;position:relative}
.app-title{font-size:24px;font-weight:900;color:#D4607A;letter-spacing:0.5px}
.header-date{font-size:12px;color:#C08090;margin-top:4px;font-weight:600}
.settings-btn{background:#fff;border:2px solid #F5C0C8;border-radius:14px;padding:9px 14px;font-size:12px;font-weight:800;color:#D4607A;cursor:pointer;display:flex;align-items:center;gap:5px;box-shadow:0 3px 10px rgba(212,96,122,0.15);font-family:inherit}

/* ── ふぅちゃん ── */
.fuu-wrap{margin:10px 14px 0;position:relative;z-index:5}
.fuu-card{background:linear-gradient(135deg,#FFF5F8,#FFE8EE);border:2px solid #FFD0DA;border-radius:20px;padding:12px 14px;padding-right:90px;min-height:54px;display:flex;align-items:center;box-shadow:0 4px 16px rgba(212,96,122,0.08)}
.fuu-text{font-size:13px;font-weight:700;color:#D4607A;line-height:1.6}
.fuu-img{width:74px;height:74px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 4px 14px rgba(212,96,122,0.3);position:absolute;top:-14px;right:14px;z-index:10;background:#FFE4EA}

/* ── ナビ ── */
.nav{display:flex;background:#fff;border-top:2px solid #FFE0E6;position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;padding:10px 4px 10px;border:none;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:#CBA0A8;font-size:10px;font-weight:700;transition:color 0.15s;font-family:inherit}
.nav-btn.active{color:#D4607A}
.nav-icon{font-size:22px;line-height:1}
.nav-svg{transition:all 0.15s;stroke:currentColor}
.nav-btn.active .nav-svg path,
.nav-btn.active .nav-svg rect,
.nav-btn.active .nav-svg circle,
.nav-btn.active .nav-svg ellipse{stroke:#D4607A}
.nav-btn.active .nav-svg circle[fill="currentColor"]{fill:#D4607A;stroke:none}

/* ── コンテンツ ── */
.content{flex:1;padding:10px 14px 90px;overflow-y:auto}

/* ── カード ── */
.card{background:#fff;border-radius:20px;padding:16px;margin-bottom:12px;border:2px solid #FFE0E6;box-shadow:0 4px 16px rgba(212,96,122,0.08)}
.card-sm{background:#fff;border-radius:16px;padding:13px 15px;margin-bottom:10px;border:2px solid #FFE0E6}

/* ── セクションラベル ── */
.sec-label{font-size:13px;font-weight:800;color:#C08090;margin:16px 0 8px;display:flex;align-items:center;gap:6px}
.sec-label:first-child{margin-top:0}

/* ── ボタン ── */
.btn{display:inline-flex;align-items:center;gap:5px;padding:10px 16px;border-radius:14px;border:2px solid #FFD0DA;background:#fff;cursor:pointer;font-size:13px;font-weight:800;color:#D4607A;transition:all 0.15s;font-family:inherit}
.btn:active{transform:scale(0.96)}
.btn-primary{background:linear-gradient(135deg,#FF8FAB,#D4607A);color:#fff;border:none;box-shadow:0 6px 18px rgba(212,96,122,0.35)}
.btn-mint{background:linear-gradient(135deg,#A8E6CF,#5CC8A0);color:#fff;border:none;box-shadow:0 4px 12px rgba(92,200,160,0.3)}
.btn-lavender{background:linear-gradient(135deg,#C8B4E8,#9B7FCC);color:#fff;border:none;box-shadow:0 4px 12px rgba(155,127,204,0.3)}
.btn-sm{padding:7px 13px;font-size:12px;border-radius:12px}
.btn-full{width:100%;justify-content:center;padding:16px}
.btn-ghost{border-color:transparent;background:transparent;color:#C08090}

/* ── 食事スロット ── */
.meal-row{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1.5px dashed #FFE0E6}
.meal-row:last-child{border-bottom:none;padding-bottom:0}
.meal-row:first-child{padding-top:0}
.meal-icon{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.meal-icon-asa{background:linear-gradient(135deg,#FFF5CC,#FFE566)}
.meal-icon-hiru{background:linear-gradient(135deg,#CCFFE8,#66DDA0)}
.meal-icon-yoru{background:linear-gradient(135deg,#E0CCFF,#A080E8)}
.meal-label{font-size:12px;font-weight:800;color:#C08090;min-width:20px}
.meal-name{flex:1;font-size:13px;color:#3D2C2C;line-height:1.4;font-weight:600;cursor:pointer;text-decoration:underline dotted #F5C0C8}
.meal-empty{flex:1;font-size:13px;color:#DDB8C0;font-weight:500}
.heart-btn{background:none;border:none;cursor:pointer;font-size:22px;line-height:1;padding:2px;transition:transform 0.15s}
.heart-btn:active{transform:scale(1.4)}

/* ── 在庫 ── */
.stock-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1.5px dashed #FFE8EC}
.stock-row:last-child{border-bottom:none;padding-bottom:0}
.stock-row:first-child{padding-top:0}
.stock-name{flex:1;font-size:14px;font-weight:600}
.stock-amount{font-size:12px;color:#C08090;text-align:right;min-width:54px;font-weight:700}
.expiry-tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;margin-left:5px}
.expiry-warn{background:#FFE4EC;color:#D4607A}
.expiry-ok{background:#F2F0EB;color:#999}

/* ── 買い物リスト ── */
.shop-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1.5px dashed #FFE8EC}
.shop-row:last-child{border-bottom:none;padding-bottom:0}
.shop-row:first-child{padding-top:0}
.check-box{width:24px;height:24px;border:2.5px solid #F5C0C8;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.15s;background:#fff}
.check-box.checked{background:linear-gradient(135deg,#FF8FAB,#D4607A);border-color:transparent}
.check-text{flex:1;font-size:14px;font-weight:600}
.check-text.done{color:#CCC;text-decoration:line-through}

/* ── 週間カレンダー ── */
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:12px}
.wk-day{text-align:center;font-size:11px;color:#CBA0A8;padding:4px 2px;font-weight:800}
.wk-date{text-align:center;font-size:14px;padding:8px 2px;border-radius:10px;cursor:pointer;color:#3D2C2C;font-weight:600}
.wk-date.today{background:linear-gradient(135deg,#FF8FAB,#D4607A);color:#fff;font-weight:900}
.wk-date.has-dot::after{content:'';display:block;width:5px;height:5px;border-radius:50%;background:#F09090;margin:2px auto 0}
.wk-date.today.has-dot::after{background:rgba(255,255,255,0.8)}

/* ── タブ ── */
.tabs{display:flex;gap:7px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 18px;border-radius:99px;font-size:13px;font-weight:800;cursor:pointer;border:2px solid #FFD0DA;background:#fff;color:#CBA0A8;white-space:nowrap;transition:all 0.15s;font-family:inherit}
.tab.active{background:linear-gradient(135deg,#FF8FAB,#D4607A);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(212,96,122,0.3)}

/* ── お気に入り ── */
.fav-card{background:#fff;border-radius:18px;padding:14px 16px;margin-bottom:10px;border:2px solid #FFE0E6;display:flex;align-items:center;gap:12px;box-shadow:0 3px 12px rgba(212,96,122,0.08)}
.fav-rank{font-size:22px;min-width:30px;text-align:center}
.fav-info{flex:1}
.fav-name{font-size:15px;font-weight:800;color:#3D2C2C}
.fav-count{font-size:12px;color:#CBA0A8;margin-top:2px;font-weight:700}

/* ── 入力 ── */
.input-label{font-size:13px;color:#C08090;margin-bottom:6px;display:block;font-weight:700}
.input-field{width:100%;padding:12px 15px;border:2px solid #FFD0DA;border-radius:14px;font-size:14px;background:#fff;color:#3D2C2C;font-family:inherit;outline:none}
.input-field:focus{border-color:#F07090;box-shadow:0 0 0 3px rgba(240,112,144,0.12)}
.input-group{margin-bottom:14px}

/* ── ストアボタン ── */
.store-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.store-btn{padding:8px 16px;border-radius:12px;font-size:12px;font-weight:800;border:2px solid #FFD0DA;background:#fff;color:#CBA0A8;cursor:pointer;font-family:inherit;transition:all 0.15s}
.store-btn.active{background:linear-gradient(135deg,#FF8FAB,#D4607A);color:#fff;border-color:transparent}

/* ── モーダル ── */
.modal-backdrop{position:fixed;inset:0;background:rgba(61,44,44,0.4);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.2s}
.modal-backdrop.open{opacity:1;pointer-events:all}
.modal-sheet{background:#FFF0F3;border-radius:28px 28px 0 0;padding:0 0 48px;width:100%;max-width:430px;max-height:88vh;overflow-y:auto;transform:translateY(30px);transition:transform 0.25s}
.modal-backdrop.open .modal-sheet{transform:translateY(0)}
.modal-handle{width:44px;height:5px;border-radius:99px;background:#F5C0C8;margin:16px auto 18px}
.modal-inner{padding:0 18px}
.modal-title{font-size:18px;font-weight:900;margin-bottom:18px;color:#D4607A}

/* ── セレクト ── */
.select-field{padding:9px 13px;border:2px solid #FFD0DA;border-radius:12px;font-size:13px;background:#fff;color:#3D2C2C;font-family:inherit;font-weight:700}

/* ── チップ ── */
.ng-list{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.ng-chip{font-size:11px;padding:4px 10px;border-radius:99px;background:#FFE8EC;color:#D4607A;font-weight:700}

/* ── AI バナー ── */
.ai-banner{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#FFF0F5,#FFE4EA);border:1.5px solid #F5C8D0;border-radius:14px;padding:11px 15px;margin-bottom:12px;font-size:12px;color:#D4607A;font-weight:700}

/* ── 警告バナー ── */
.warn-banner{background:#FFF8E8;border-radius:16px;padding:13px 15px;margin-bottom:12px;border:2px solid #F5DFA0}
.warn-banner-title{font-size:13px;font-weight:800;color:#B5740A;margin-bottom:5px}
.warn-item{font-size:13px;color:#B5740A;font-weight:600}

/* ── 人数選択 ── */
.persons-row{display:flex;gap:6px;margin-top:6px}
.person-btn{flex:1;padding:10px;border-radius:12px;font-size:13px;font-weight:800;border:2px solid #FFD0DA;background:#fff;color:#CBA0A8;cursor:pointer;font-family:inherit;text-align:center;transition:all 0.15s}
.person-btn.active{background:linear-gradient(135deg,#FF8FAB,#D4607A);color:#fff;border-color:transparent}

/* ── トースト ── */
.toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#FF8FAB,#D4607A);color:#fff;font-size:13px;font-weight:800;padding:12px 22px;border-radius:99px;z-index:200;opacity:0;pointer-events:none;transition:opacity 0.2s;white-space:nowrap;box-shadow:0 6px 20px rgba(212,96,122,0.4)}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <div class="header" style="position:relative;overflow:visible">
    <div class="header-deco">
      <span style="top:8px;left:20px">🩷</span>
      <span style="top:14px;left:80px;font-size:7px">✦</span>
      <span style="top:6px;left:140px;font-size:8px">🌸</span>
      <span style="top:8px;left:260px;font-size:8px">🩷</span>
    </div>
    <div class="header-row">
      <div>
        <div class="app-title">🍴🥄 こんだて帳 🩷</div>
        <div class="header-date" id="header-date"></div>
      </div>
      <button class="settings-btn" onclick="openModal('settings')">⚙️ 設定</button>
    </div>
  </div>

  <div class="fuu-wrap">
    <div class="fuu-card">
      <div class="fuu-text" id="fuu-message">ふぅちゃんと一緒に<br>明日のごはん考えよ🌸</div>
    </div>
    <img src="https://raw.githubusercontent.com/SakiKihara/kondate/main/%E3%81%B5%E3%81%85%E3%81%A1%E3%82%83%E3%82%93.jpg"
      alt="ふぅちゃん"
      style="width:74px;height:74px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 4px 14px rgba(212,96,122,0.3);position:absolute;top:-10px;right:14px;z-index:10;background:#FFE4EA">
  </div>

  <div class="content" id="content" style="margin-top:12px"></div>

  <nav class="nav">
    <button class="nav-btn active" id="nav-today" onclick="switchPage('today')">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" class="nav-svg">
        <!-- フライパン手書き風 -->
        <path d="M8 18 Q7 12 12 10 Q17 8 20 12 Q23 16 19 20 Q15 23 10 21 Z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M19 19 Q22 21 24 22" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <ellipse cx="14" cy="15" rx="3" ry="2.5" stroke="currentColor" stroke-width="1.4" fill="none"/>
        <path d="M7 10 Q6 8 8 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
      </svg>
      献立
    </button>
    <button class="nav-btn" id="nav-stock" onclick="switchPage('stock')">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" class="nav-svg">
        <!-- 野菜手書き風（にんじん） -->
        <path d="M14 22 Q11 18 11 13 Q11 8 14 7 Q17 8 17 13 Q17 18 14 22 Z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M14 7 Q12 5 10 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M14 7 Q14 5 14 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M14 7 Q16 5 18 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M12 13 Q14 12 16 13" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
        <path d="M11.5 16 Q14 15 16.5 16" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
      在庫
    </button>
    <button class="nav-btn" id="nav-week" onclick="switchPage('week')">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" class="nav-svg">
        <!-- カレンダー手書き風 -->
        <rect x="5" y="8" width="18" height="15" rx="2.5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <path d="M5 13 Q14 12.5 23 13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <path d="M10 6 Q10 10 10 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M18 6 Q18 10 18 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="10" cy="17" r="1.2" fill="currentColor"/>
        <circle cx="14" cy="17" r="1.2" fill="currentColor"/>
        <circle cx="18" cy="17" r="1.2" fill="currentColor"/>
        <circle cx="10" cy="21" r="1.2" fill="currentColor"/>
        <circle cx="14" cy="21" r="1.2" fill="currentColor"/>
      </svg>
      記録
    </button>
    <button class="nav-btn" id="nav-fav" onclick="switchPage('fav')">
      <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" class="nav-svg">
        <!-- ハート手書き風 -->
        <path d="M14 21 Q8 16 7 12 Q6 8 10 7 Q12 6.5 14 9 Q16 6.5 18 7 Q22 8 21 12 Q20 16 14 21 Z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M11 11 Q12 10 13 11" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
      </svg>
      お気に入り
    </button>
  </nav>
</div>

<div class="modal-backdrop" id="modal-backdrop" onclick="closeModal()">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-inner" id="modal-inner"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const DAYS = ['日','月','火','水','木','金','土'];
const today = new Date();
const todayDow = today.getDay();
const tomorrow = new Date(today); tomorrow.setDate(today.getDate()+1);

// ── 食材→メニュー対応表 ──
const INGREDIENT_MENU_MAP = {
  // 肉類
  '豚バラ':    ['豚の生姜焼き・キャベツの浅漬け・ほうれん草のお浸し・味噌汁・ご飯', '豚のしょうが焼き・きのこのソテー・トマトサラダ・豚汁・ご飯', '焼きナスよだれ豚・中華スープ・ご飯'],
  '豚ロース':  ['豚の生姜焼き・キャベツの浅漬け・ほうれん草のお浸し・味噌汁・ご飯', '大葉チーズカツ・ポテトサラダ・コンソメスープ・ご飯'],

  '鶏むね':    ['ねぎ塩チキン・中華スープ・ご飯', '鶏むねスティック・コンソメスープ・グリーンサラダ・ご飯', '鶏むね肉のピカタ・ミネストローネ・ブロッコリーサラダ・パン'],
  '鶏ひき肉':  ['そぼろ丼・味噌汁', '鶏つくね・ほうれん草のお浸し・すまし汁・ご飯'],
  '合い挽き肉':['ハンバーグ・コンソメスープ・温野菜・ご飯'],
  '牛こま':    ['肉じゃが・きゅうりとわかめの酢の物・味噌汁・ご飯', 'チャプチェ・わかめスープ・ご飯'],
  // 魚介類
  '鮭':        ['鮭の塩焼き・ほうれん草のお浸し・ひじきの煮物・味噌汁・ご飯'],
  'サバ':      ['サバの味噌煮・大根の煮物・きゅうりの酢の物・味噌汁・ご飯'],
  'ぶり':      ['ぶりの照り焼き・小松菜のお浸し・なめこの味噌汁・ご飯'],
  'エビ':      ['エビチリ・中華スープ・ご飯', 'エビの塩炒め・中華スープ・ご飯'],
  // 豆腐・卵
  '豆腐':      ['麻婆豆腐・中華スープ・ご飯', '豆腐ステーキ・ほうれん草のお浸し・味噌汁・ご飯'],
  '卵':        ['卵焼き・ほうれん草のお浸し・味噌汁・ご飯', '親子丼・味噌汁'],
  // 野菜
  'キャベツ':  ['豚の生姜焼き・キャベツの浅漬け・ほうれん草のお浸し・味噌汁・ご飯', '餃子・もやしのナムル・中華スープ・ご飯'],
  'ほうれん草':['鮭の塩焼き・ほうれん草のお浸し・ひじきの煮物・味噌汁・ご飯', '鶏の照り焼き・ほうれん草のごま和え・大根サラダ・すまし汁・ご飯'],
  'じゃがいも':['肉じゃが・きゅうりとわかめの酢の物・味噌汁・ご飯', 'シチュー・パン'],
  'なす':      ['焼きナスよだれ豚・中華スープ・ご飯', '麻婆なす・中華スープ・ご飯'],

// 在庫から使えるメニューを取得
function getMenusFromStock() {
  const allStock = S.stock.食材.map(i => i.name);
  const matched = [];
  allStock.forEach(stockName => {
    Object.entries(INGREDIENT_MENU_MAP).forEach(([ingredient, menus]) => {
      if (stockName.includes(ingredient) || ingredient.includes(stockName)) {
        menus.forEach(m => { if (!matched.includes(m)) matched.push(m); });
      }
    });
  });
  return matched;
}

// ── 献立提案ロジック ──
function isWeekendDay(date) {
  return date.getDay() === 0 || date.getDay() === 6;
}

function suggestMeal(time, persons) {
  const isWeekend = isWeekendDay(tomorrow);
  const favMains = S.fav.filter(f => f.category === 'main');
  const favComplete = S.fav.filter(f => f.category === 'complete');
  const favSides = S.fav.filter(f => f.category === 'side');
  const favSoups = S.fav.filter(f => f.category === 'soup');
  const ngFoods = S.family.flatMap(m => m.ng);

  // 在庫の食材名リスト
  const stockItems = S.stock.食材.map(i => i.name);

  if (time === '朝') {
    const menu = MENU_POOL.朝[Math.floor(Math.random() * MENU_POOL.朝.length)];
    return { name: menu, recipe: null, shopping: [] };
  }

  if (time === '昼') {
    const pool = isWeekend ? MENU_POOL.昼_休日 : MENU_POOL.昼_平日;
    const menu = pool[Math.floor(Math.random() * pool.length)];
    return { name: menu, recipe: null, shopping: [] };
  }

  if (time === '夜') {
    // ① 在庫から使えるメニューを取得
    const stockMenus = getMenusFromStock();

    // ② 在庫メニューがあればまず優先（70%の確率）
    if (stockMenus.length > 0 && Math.random() > 0.3) {
      const filtered = stockMenus.filter(m => !ngFoods.some(ng => m.includes(ng)));
      if (filtered.length > 0) {
        const menu = filtered[Math.floor(Math.random() * filtered.length)];
        // 使った食材を在庫から減らすフラグ（表示用）
        return { name: menu, recipe: null, shopping: [], fromStock: true };
      }
    }

    // ③ お気に入りのメインを使う（50%の確率）
    if (favMains.length > 0 && Math.random() > 0.5) {
      const fav = favMains[Math.floor(Math.random() * favMains.length)];
      const hasNG = ngFoods.some(ng => fav.name.includes(ng));
      if (!hasNG) {
        const side1 = favSides.length > 0 ? favSides[Math.floor(Math.random()*favSides.length)].name : 'ほうれん草のお浸し';
        const side2 = favSides.length > 1 ? favSides.filter(s=>s.name!==side1)[Math.floor(Math.random()*(favSides.length-1))].name : 'きゅうりの酢の物';
        const soup = favSoups.length > 0 ? favSoups[Math.floor(Math.random()*favSoups.length)].name : '味噌汁';
        return { name: `${fav.name}・${side1}・${side2}・${soup}・ご飯`, recipe: null, shopping: [] };
      }
    }

    // ④ 完結系
    if (Math.random() > 0.75) {
      const pool = [...MENU_POOL.夜_完結, ...(favComplete.map(f => ({main:f.name, sides:'', complete:true})))];
      const item = pool[Math.floor(Math.random() * pool.length)];
      return { name: item.main + (item.sides ? '・' + item.sides : ''), recipe: null, shopping: [] };
    }

    // ⑤ 和洋中バランスのプールから
    const cats = ['夜_和','夜_洋','夜_中'];
    const cat = cats[Math.floor(Math.random() * cats.length)];
    const pool = MENU_POOL[cat];
    const item = pool[Math.floor(Math.random() * pool.length)];
    const hasNG = ngFoods.some(ng => item.main.includes(ng) || item.sides.includes(ng));
    if (hasNG) {
      const fallback = MENU_POOL.夜_和[0];
      return { name: `${fallback.main}・${fallback.sides}`, recipe: null, shopping: [] };
    }
    return { name: `${item.main}・${item.sides}`, recipe: null, shopping: [] };
  }

  return { name: '未定', recipe: null, shopping: [] };
}

          <div style="min-width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#FF8FAB,#D4607A);color:#fff;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0">${i+1}</div>
          <div style="font-size:13px;line-height:1.7;color:#3D2C2C;font-weight:500">${s}</div>
        </div>`).join('')}
      </div>
      <button class="btn btn-full" style="border-color:#F5C0C8;color:#D4607A" onclick="closeModal()">閉じる</button>`;

  } else if (type === 'addStock') {
    inn.innerHTML = `<div class="modal-title">📦 在庫を追加</div>
      <div class="input-group"><label class="input-label">品名</label><input id="stock-name" class="input-field" placeholder="例：豚バラ、シャンプー"></div>
      <div class="input-group"><label class="input-label">量</label><input id="stock-amt" class="input-field" placeholder="例：300g、2個、1本"></div>
      <div class="input-group"><label class="input-label">賞味期限（任意）</label><input id="stock-exp" class="input-field" type="date"></div>
      <div class="input-group"><label class="input-label">カテゴリ</label>
        <div class="store-row" id="stock-cat-row">
          <button class="store-btn active" onclick="selectBtn('stock-cat-row',this)">食材</button>
          <button class="store-btn" onclick="selectBtn('stock-cat-row',this)">調味料</button>
          <button class="store-btn" onclick="selectBtn('stock-cat-row',this)">日用品</button>
        </div>
      </div>
      <button class="btn btn-primary btn-full" onclick="addStock()">追加する 🌸</button>`;

  } else if (type === 'editStock') {
    const item = S.stock[a1][Number(a2)];
    inn.innerHTML = `<div class="modal-title">✏️ 在庫を編集</div>
      <div class="input-group"><label class="input-label">品名</label><input id="edit-stock-name" class="input-field" value="${item.name}"></div>
      <div class="input-group"><label class="input-label">量</label><input id="edit-stock-amt" class="input-field" value="${item.amount}"></div>
      ${item.expiry ? `<div class="input-group"><label class="input-label">賞味期限</label><input id="edit-stock-exp" class="input-field" value="${item.expiry}"></div>` : ''}
      <button class="btn btn-primary btn-full" style="margin-bottom:10px" onclick="saveStock('${a1}',${a2})">保存する</button>
      <button class="btn btn-full" style="color:#C0392B;border-color:#FBDADA" onclick="deleteStock('${a1}',${a2})">削除する</button>`;

  } else if (type === 'addFav') {
    inn.innerHTML = `<div class="modal-title">🩷 お気に入りを追加</div>
      <div class="input-group"><label class="input-label">メニュー名</label><input id="fav-input" class="input-field" placeholder="例：唐揚げ、肉じゃが"></div>
      <div class="input-group"><label class="input-label">カテゴリ</label>
        <div class="store-row" id="fav-cat-row">
          <button class="store-btn active" onclick="selectBtn('fav-cat-row',this)">🍖 メイン</button>
          <button class="store-btn" onclick="selectBtn('fav-cat-row',this)">🥗 副菜</button>
          <button class="store-btn" onclick="selectBtn('fav-cat-row',this)">🍜 汁物</button>
          <button class="store-btn" onclick="selectBtn('fav-cat-row',this)">🍱 完結系</button>
        </div>
        <div style="font-size:11px;color:#C08090;margin-top:8px;line-height:1.6">
          🍖 メイン：唐揚げ・生姜焼きなど<br>🥗 副菜：お浸し・サラダなど<br>🍜 汁物：味噌汁・豚汁など<br>🍱 完結系：カレー・シチューなど
        </div>
      </div>
      <button class="btn btn-primary btn-full" onclick="addFav()">追加する 🌸</button>`;

  } else if (type === 'settings') {
    let h = `<div class="modal-title">⚙️ 設定</div>
      <div class="sec-label" style="margin-top:0">👨‍👩‍👦‍👦 家族構成・苦手食材</div>
      <div class="card" style="margin-bottom:14px">`;
    S.family.forEach((m, idx) => {
      h += `<div class="stock-row">
        <div style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#FF8FAB,#D4607A);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#fff;flex-shrink:0">${m.avatar}</div>
        <div style="flex:1;margin-left:10px">
          <div style="font-size:14px;font-weight:800">${m.name}</div>
          <div class="ng-list">${m.ng.map(n=>`<span class="ng-chip">🙅 ${n}</span>`).join('')}</div>
        </div>
        <button class="btn btn-sm btn-ghost" onclick="openModal('editFamily',${idx})">✏️</button>
      </div>`;
    });
    h += `</div><button class="btn btn-full" style="border-color:#F5C0C8;color:#D4607A" onclick="closeModal()">閉じる</button>`;
    inn.innerHTML = h;

  } else if (type === 'editFamily') {
    const m = S.family[Number(a1)];
    inn.innerHTML = `<div class="modal-title">✏️ ${m.name}の設定</div>
      <div class="input-group">
        <label class="input-label">苦手食材（読点・カンマ区切り）</label>
        <input id="ng-input" class="input-field" value="${m.ng.join('、')}" placeholder="例：ピーマン、にんじん">
      </div>
      <button class="btn btn-primary btn-full" onclick="saveFamily(${a1})">保存する 🌸</button>`;

  } else if (type === 'weekDetail') {
    const dow = Number(a1);
    const d = new Date(today); d.setDate(today.getDate()-todayDow+dow);
    const meals = S.week[dow] || {};
    inn.innerHTML = `<div class="modal-title">${d.getMonth()+1}/${d.getDate()}（${DAYS[dow]}）の記録</div>
      ${['朝','昼','夜'].map(s => `
        <div style="padding:10px 0;border-bottom:1.5px dashed #FFE8EC">
          <div style="font-size:12px;font-weight:800;color:#C08090;margin-bottom:4px">${s}ごはん</div>
          <div style="font-size:14px;font-weight:600">${meals[s] ? meals[s].name + '（' + meals[s].persons + '人）' : '記録なし'}</div>
        </div>`).join('')}
      <div style="padding-top:14px">
        <button class="btn btn-full" style="border-color:#F5C0C8;color:#D4607A" onclick="closeModal()">閉じる</button>
      </div>`;
  }
}

// ── アクション ──
function setPersons(time, n, el) {
  S.tomorrow[time].persons = n;
  const row = el.parentElement;
  row.querySelectorAll('.person-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
}

function doSuggestAll() {
  ['朝','昼','夜'].forEach(t => {
    const result = suggestMeal(t, S.tomorrow[t].persons);
    S.tomorrow[t].name = result.name;
    S.tomorrow[t].recipe = result.recipe;
    if (result.shopping) result.shopping.forEach(item => {
      if (!S.shopping.find(s => s.name === item)) S.shopping.push({name:item, done:false});
    });
  });
  saveData();
  showToast('✨ 明日の献立を提案しました！');
  closeModal();
  render();
  // 記録にも追加
  recordToWeek();
}

function doSuggestSingle(time) {
  const result = suggestMeal(time, S.tomorrow[time].persons);
  S.tomorrow[time].name = result.name;
  S.tomorrow[time].recipe = result.recipe;
  saveData();
  showToast('✨ 献立を提案しました！');
  closeModal();
  render();
  recordToWeek();
}

function recordToWeek() {
  const tomorrowDow = tomorrow.getDay();
  if (!S.week[tomorrowDow]) S.week[tomorrowDow] = {};
  ['朝','昼','夜'].forEach(t => {
    if (S.tomorrow[t].name) {
      S.week[tomorrowDow][t] = { name: S.tomorrow[t].name, persons: S.tomorrow[t].persons, liked: S.tomorrow[t].liked };
    }
  });
  saveData();
}

function saveMealEdit(time) {
  const input = document.getElementById('meal-input');
  if (!input || !input.value.trim()) { showToast('メニュー名を入力してね'); return; }
  S.tomorrow[time].name = input.value.trim();
  saveData(); showToast('✅ 更新しました'); closeModal(); render();
  recordToWeek();
}

function clearMeal(time) {
  S.tomorrow[time].name = null;
  S.tomorrow[time].recipe = null;
  saveData(); showToast('🗑️ 削除しました'); closeModal(); render();
}

function toggleLike(time) {
  const m = S.tomorrow[time];
  m.liked = !m.liked;
  if (m.liked && m.name) {
    const ex = S.fav.find(f => f.name === m.name);
    if (ex) ex.count++;
    else S.fav.unshift({name:m.name, count:1, category:'main'});
    S.fav.sort((a,b) => b.count - a.count);
    showToast('❤️ お気に入りに追加しました');
  }
  saveData(); render();
  recordToWeek();
}

function toggleShop(idx) {
  S.shopping[idx].done = !S.shopping[idx].done;
  saveData(); render();
}

function removeShop(idx) {
  S.shopping.splice(idx, 1);
  saveData(); render();
}

function addStock() {
  const name = document.getElementById('stock-name').value.trim();
  const amt = document.getElementById('stock-amt').value.trim();
  const expEl = document.getElementById('stock-exp');
  const catBtn = document.querySelector('#stock-cat-row .store-btn.active');
  if (!name) { showToast('品名を入力してね'); return; }
  const cat = catBtn ? catBtn.textContent : '食材';
  let expiry = null, warn = false;
  if (expEl && expEl.value) {
    const parts = expEl.value.split('-');
    expiry = parseInt(parts[1]) + '/' + parseInt(parts[2]);
    const expDate = new Date(expEl.value);
    const diff = (expDate - today) / (1000*60*60*24);
    warn = diff <= 3;
  }
  S.stock[cat].push({name, amount:amt||'あり', expiry, warn});
  saveData(); showToast('✅ 追加しました'); closeModal(); render();
}

function saveStock(cat, idx) {
  const nameEl = document.getElementById('edit-stock-name');
  const amtEl = document.getElementById('edit-stock-amt');
  if (nameEl) S.stock[cat][idx].name = nameEl.value.trim();
  if (amtEl) S.stock[cat][idx].amount = amtEl.value.trim();
  saveData(); showToast('✅ 更新しました'); closeModal(); render();
}

function deleteStock(cat, idx) {
  S.stock[cat].splice(idx, 1);
  saveData(); showToast('🗑️ 削除しました'); closeModal(); render();
}

function addFav() {
  const val = document.getElementById('fav-input').value.trim();
  const catBtn = document.querySelector('#fav-cat-row .store-btn.active');
  if (!val) { showToast('メニュー名を入力してね'); return; }
  const catLabel = catBtn ? catBtn.textContent : '🍖 メイン';
  const cat = catLabel.includes('メイン') ? 'main' : catLabel.includes('副菜') ? 'side' : catLabel.includes('汁物') ? 'soup' : 'complete';
  const ex = S.fav.find(f => f.name === val);
  if (ex) ex.count++;
  else S.fav.push({name:val, count:1, category:cat});
  S.fav.sort((a,b) => b.count - a.count);
  saveData(); showToast('❤️ 追加しました'); closeModal(); render();
}

function deleteFav(idx) {
  S.fav.splice(idx, 1);
  saveData(); showToast('🗑️ 削除しました'); render();
}

function saveFamily(idx) {
  const input = document.getElementById('ng-input');
  if (!input) return;
  S.family[idx].ng = input.value.split(/[,、，]/).map(s => s.trim()).filter(s => s.length > 0);
  saveData(); showToast('✅ 更新しました'); openModal('settings');
}

function selectBtn(rowId, el) {
  document.querySelectorAll('#'+rowId+' .store-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
}

function closeModal() {
  document.getElementById('modal-backdrop').classList.remove('open');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ── データ保存 ──
const STORAGE_KEY = 'kondate_v2';
function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      tomorrow:S.tomorrow, stock:S.stock, shopping:S.shopping,
      fav:S.fav, family:S.family, week:S.week,
    }));
  } catch(e) {}
}
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (d.tomorrow) S.tomorrow = d.tomorrow;
    if (d.stock) S.stock = d.stock;
    if (d.shopping) S.shopping = d.shopping;
    if (d.fav) S.fav = d.fav;
    if (d.family) S.family = d.family;
    if (d.week) S.week = d.week;
  } catch(e) {}
}

loadData();
render();
</script>
</body>
</html>
